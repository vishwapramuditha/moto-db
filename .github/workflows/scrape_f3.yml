name: Scrape FIA Formula 3 Data

on:
  schedule:
    # Run every Monday at 09:00 UTC (F3 races alongside F1 weekends)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      all_time:
        description: 'Fetch all historical data (2019 onwards)'
        required: false
        type: boolean
        default: false

concurrency:
  group: scrape-f3
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push committed changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run F3 Scraper
        run: |
          if [ "${{ github.event.inputs.all_time }}" == "true" ]; then
            python scripts/scrape_f3.py --all-time
          else
            python scripts/scrape_f3.py
          fi

      - name: Validate Data
        run: python scripts/validate_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/f3/

          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No new data changes to commit."
          else
            git commit -m "auto(data): update F3 data [skip ci]"
            git push
          fi
